<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIL CLUB</title>

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

/* LOGO */
.logo{
  width:120px;
  display:block;
  margin:10px auto;
  filter: drop-shadow(0 0 15px red);
}

/* TITLE */
h1{
  color:#ff0033;
  text-shadow:0 0 15px #ff0033;
  font-size:40px;
}

/* CATEGORY */
.category button{
  margin:5px;
  background:#111;
  border:1px solid red;
  color:white;
}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.item{
  background:#111;
  border:1px solid #ff0033;
  border-radius:15px;
  padding:15px;
}

.item h3{
  font-size:20px;
}

.item p{
  font-size:18px;
}

button{
  background:#ff0033;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

input{
  width:60px;
  text-align:center;
}

/* STATUS */
#status{
  font-size:22px;
  margin-top:20px;
  color:#00ffcc;
}

/* BAR SCREEN (จำลองหน้าบาร์) */
#bar{
  margin-top:20px;
  padding:15px;
  border:2px solid red;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGO -->
<img src="logo.png" class="logo">

<h1>🍸 LIL CLUB</h1>

<!-- TABLE -->
<select id="table" style="display:none;"></select>

<!-- CATEGORY -->
<div class="category">
  <button onclick="showCategory('all')">All</button>
  <button onclick="showCategory('vodka')">Vodka</button>
  <button onclick="showCategory('beer')">Beer</button>
  <button onclick="showCategory('cocktail')">Cocktail</button>
</div>

<!-- MENU -->
<div class="menu">

<div class="item vodka">
  <h3>Absolut</h3>
  <p>220</p>
  <input type="number" id="qty-absolut" value="1" min="1"><br><br>
  <button onclick="orderDrink('Absolut',220,'qty-absolut')">ORDER</button>
</div>

<div class="item beer">
  <h3>Heineken</h3>
  <p>120</p>
  <input type="number" id="qty-heineken" value="1" min="1"><br><br>
  <button onclick="orderDrink('Heineken',120,'qty-heineken')">ORDER</button>
</div>

<div class="item cocktail">
  <h3>Mojito</h3>
  <p>220</p>
  <input type="number" id="qty-mojito" value="1" min="1"><br><br>
  <button onclick="orderDrink('Mojito',220,'qty-mojito')">ORDER</button>
</div>

</div>

<!-- STATUS -->
<h2 id="status">Ready</h2>

<!-- BAR SCREEN -->
<div id="bar">
  <h3>🍺 BAR SCREEN</h3>
  <p id="barLog">No orders yet</p>
</div>

<!-- BIRTHDAY -->
<h2>🎂 Birthday</h2>
<input type="text" id="bdayName" placeholder="Name"><br><br>
<input type="file" id="bdayImage"><br><br>
<button onclick="uploadBirthday()">UPLOAD</button>

<!-- OPENING -->
<h3 style="color:#ff0033;">🕒 Opening Hours</h3>
<p>Open daily from 10 PM till late</p>

<script>

// 📌 TABLE FROM QR
const params = new URLSearchParams(window.location.search);
const table = params.get("table") || "T1";

document.getElementById("table").innerHTML =
  `<option>${table}</option>`;

// 📌 FILTER
function showCategory(cat){
  const items = document.querySelectorAll('.item');

  items.forEach(i=>{
    if(cat === 'all'){
      i.style.display = 'block';
    }else{
      i.style.display =
        i.classList.contains(cat) ? 'block' : 'none';
    }
  });
}

// 📌 ORDER
function orderDrink(name, price, qtyId){

  const qty = document.getElementById(qtyId).value;

  const text = `🍸 ${name} x${qty} | โต๊ะ: ${table}`;

  // ลูกค้าเห็น
  document.getElementById("status").innerHTML = text;

  // เด้งไปหน้าบาร์
  document.getElementById("barLog").innerHTML = text;
}

// 📌 BIRTHDAY
function uploadBirthday(){

  const name = document.getElementById("bdayName").value;
  const file = document.getElementById("bdayImage").files[0];

  if(!name || !file){
    alert("ใส่ชื่อ + รูปก่อน");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    const img = document.createElement("img");
    img.src = e.target.result;
    img.style.width = "120px";
    img.style.marginTop = "10px";
    document.body.appendChild(img);
  }

  reader.readAsDataURL(file);

  document.getElementById("status").innerHTML =
    `🎂 Happy Birthday ${name}`;
}

</script>

</body>
</html>
